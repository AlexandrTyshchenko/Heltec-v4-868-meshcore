; Heltec V4 868: Heltec WiFi LoRa 32 V4 (ESP32-S3 + SX1262 + GC1109 PA), OLED and TFT versions,
; with our radio/GPS patches. Board sources and base envs are in variants/heltec_v4.
; Radio: app preset "EU/UK (Narrow)" 869.618 MHz / BW 62.5 / SF8 / CR8
; (upstream builds use CR5 unless LORA_CR is set).
; Power: LORA_TX_POWER=10 on the SX1262 is ~22 dBm out of the GC1109 PA (as upstream heltec_v4).

[heltec_v4_868]
our_flags =
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D GPS_BAUD_AUTODETECT
  -D GPS_DUTY_CYCLE
  -D GPS_CYCLE_MIN=30
  -D GPS_ONTIME_SEC=300
  -D GPS_GUARD
  -D GPS_GUARD_LAT_MIN=44.0
  -D GPS_GUARD_LAT_MAX=52.5
  -D GPS_GUARD_LON_MIN=22.0
  -D GPS_GUARD_LON_MAX=40.3

; ---------- OLED ----------

[env:Heltec_V4_868_repeater]
extends = env:heltec_v4_repeater
build_flags = ${env:heltec_v4_repeater.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_room_server]
extends = env:heltec_v4_room_server
build_flags = ${env:heltec_v4_room_server.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_companion_radio_ble]
extends = env:heltec_v4_companion_radio_ble
build_flags = ${env:heltec_v4_companion_radio_ble.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_sensor]
extends = env:heltec_v4_sensor
build_flags = ${env:heltec_v4_sensor.build_flags}
  ${heltec_v4_868.our_flags}

; ---------- TFT ----------

[env:Heltec_V4_868_tft_repeater]
extends = env:heltec_v4_tft_repeater
build_flags = ${env:heltec_v4_tft_repeater.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_tft_room_server]
extends = env:heltec_v4_tft_room_server
build_flags = ${env:heltec_v4_tft_room_server.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_tft_companion_radio_ble]
extends = env:heltec_v4_tft_companion_radio_ble
build_flags = ${env:heltec_v4_tft_companion_radio_ble.build_flags}
  ${heltec_v4_868.our_flags}

[env:Heltec_V4_868_tft_sensor]
extends = env:heltec_v4_tft_sensor
build_flags = ${env:heltec_v4_tft_sensor.build_flags}
  ${heltec_v4_868.our_flags}
